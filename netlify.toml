[build]
  base    = "."
  command = "pnpm --filter @workspace/anime-site run build"
  publish = "artifacts/anime-site/dist/public"

[build.environment]
  NODE_VERSION = "22"
  BASE_PATH    = "/"

[[redirects]]
  from   = "/api/*"
  to     = "/api/:splat"
  status = 404
  force  = true

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
